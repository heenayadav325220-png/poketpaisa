<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PocketPaisa Pro - Smart Money Tracker</title>
    <style>
        /* ओरिजिनल स्टाइल बरकरार रखा है, बस AI पैनल जोड़ा है */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; transition: 0.3s; }
        body { background-color: #f0f3f7; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; }
        .app-container { background: white; width: 100%; max-width: 480px; padding: 25px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); }
        .stats-panel { margin: 15px 0; padding: 15px; background: #34495e; color: white; border-radius: 10px; display: none; }
        .btn-ui { padding: 10px; border-radius: 8px; border: none; background: #3498db; color: white; cursor: pointer; margin-top: 10px; width: 100%; }
        /* बाकी ओरिजिनल CSS... */
        body.dark-mode { background-color: #1a252f; color: #f5f6fa; }
        .header-area { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .input-group input { width: 100%; padding: 10px; margin-top: 5px; border-radius: 8px; border: 1px solid #ddd; }
        button { width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; color: white; margin-top: 10px; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header-area">
        <h2 id="userNameDisplay">PocketPaisa Pro</h2>
        <button onclick="toggleStats()" style="width: auto; background:#e67e22">📊 AI Stats</button>
    </div>

    <div id="statsPanel" class="stats-panel">
        <h4 id="aiMessage">AI Coach: Analyzing...</h4>
        <p id="dailyAvg">Avg Daily: ₹0</p>
        <p id="topCategory">Top Expense: -</p>
        <button onclick="shareReport()" style="background:#9b59b6">Share My Report 🚀</button>
    </div>

    <div class="input-group">
        <input type="text" id="userNameInput" placeholder="अपना नाम लिखें...">
        <button onclick="saveUser()" style="background:#2980b9">Save Profile</button>
    </div>

    <div class="input-group">
        <input type="number" id="amount" placeholder="Amount">
        <input type="text" id="category" placeholder="Category">
    </div>
    <button style="background:#2ecc71" onclick="addTransaction('income')">+ Add Income</button>
    <button style="background:#e74c3c" onclick="addTransaction('expense')">- Add Expense</button>
</div>

<div style="position:fixed; bottom:10px; right:10px; opacity:0.5; font-size:12px;">
    Views: <img src="https://www.freehitcounters.com/hc/123456789/t/5" alt="stats">
</div>

<script>
    let user = JSON.parse(localStorage.getItem('user')) || { name: 'Friend' };
    let transactions = JSON.parse(localStorage.getItem('web_transactions_v2')) || [];

    function saveUser() {
        user.name = document.getElementById('userNameInput').value;
        localStorage.setItem('user', JSON.stringify(user));
        alert("Welcome " + user.name + "! Profile Updated.");
    }

    function toggleStats() {
        const panel = document.getElementById('statsPanel');
        panel.style.display = (panel.style.display === 'block') ? 'none' : 'block';
        if(panel.style.display === 'block') runAI();
    }

    function runAI() {
        let total = transactions.reduce((sum, t) => t.type === 'expense' ? sum + t.amount : sum, 0);
        let avg = (total / 30).toFixed(2);
        document.getElementById('dailyAvg').innerText = "Avg Daily Expense: ₹" + avg;
        document.getElementById('aiMessage').innerText = user.name + ", " + (total > 5000 ? "खर्चा थोड़ा कंट्रोल करो!" : "बहतरीन बचत कर रहे हो!");
    }

    function addTransaction(type) {
        let amount = parseFloat(document.getElementById('amount').value);
        let category = document.getElementById('category').value || 'Other';
        transactions.unshift({ type, amount, category, date: new Date() });
        localStorage.setItem('web_transactions_v2', JSON.stringify(transactions));
        alert("Transaction Saved for " + user.name);
    }

    function shareReport() {
        let msg = `Hey! ${user.name} is using PocketPaisa Pro to save money. Join me!`;
        if (navigator.share) navigator.share({text: msg});
        else alert("Copy this: " + msg);
    }

    document.getElementById('userNameDisplay').innerText = "Hi, " + user.name;
</script>

</body>
</html>
