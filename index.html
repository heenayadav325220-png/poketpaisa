<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PocketPaisa - Money Tracker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .app-container {
            background: white;
            width: 100%;
            max-width: 450px;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #2c3e50;
        }

        .balance-card {
            background: linear-gradient(135deg, #2ecc71, #27ae60);
            color: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            margin-bottom: 25px;
            transition: background 0.3s;
        }

        .balance-card.negative {
            background: linear-gradient(135deg, #e74c3c, #c0392b);
        }

        .balance-card p {
            font-size: 14px;
            opacity: 0.9;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .balance-card h1 {
            font-size: 32px;
            margin-top: 5px;
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            font-weight: 600;
            color: #555;
        }

        .input-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
        }

        .input-group input:focus {
            border-color: #3498db;
        }

        .btn-container {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            color: white;
            transition: transform 0.1s;
        }

        button:active {
            transform: scale(0.98);
        }

        .btn-income { background-color: #2ecc71; }
        .btn-expense { background-color: #e74c3c; }

        .history-section h3 {
            font-size: 16px;
            color: #7f8c8d;
            margin-bottom: 10px;
            border-bottom: 1px solid #eee;
            padding-bottom: 5px;
        }

        .transaction-list {
            list-style: none;
            max-height: 200px;
            overflow-y: auto;
        }

        .transaction-item {
            display: flex;
            justify-content: space-between;
            padding: 10px;
            background: #f8f9fa;
            margin-bottom: 8px;
            border-radius: 6px;
            font-size: 14px;
            border-left: 5px solid #ccc;
        }

        .transaction-item.income-type { border-left-color: #2ecc71; }
        .transaction-item.expense-type { border-left-color: #e74c3c; }

        .item-details span {
            display: block;
        }
        .item-category {
            font-size: 12px;
            color: #7f8c8d;
        }
        .item-amount {
            font-weight: bold;
            align-self: center;
        }
    </style>
</head>
<body>

<div class="app-container">
    <h2>💰 PocketPaisa</h2>
    
    <!-- Balance Display -->
    <div class="balance-card" id="balanceCard">
        <p>Current Balance</p>
        <h1 id="balanceDisplay">₹0.00</h1>
    </div>

    <!-- Inputs -->
    <div class="input-group">
        <label for="amount">Amount (₹)</label>
        <input type="number" id="amount" placeholder="e.g. 500" min="0">
    </div>
    <div class="input-group">
        <label for="category">Category / Description</label>
        <input type="text" id="category" placeholder="e.g. Cricket Bat, Party, Pocket Money">
    </div>

    <!-- Buttons -->
    <div class="btn-container">
        <button class="btn-income" onclick="addTransaction('income')">+ Income</button>
        <button class="btn-expense" onclick="addTransaction('expense')">- Expense</button>
    </div>

    <!-- History -->
    <div class="history-section">
        <h3>Transaction History</h3>
        <ul class="transaction-list" id="transactionList">
            <!-- Items will be added here dynamically -->
        </ul>
    </div>
</div>

<script>
    // App State Load from LocalStorage
    let balance = parseFloat(localStorage.getItem('balance')) || 0.0;
    let transactions = JSON.parse(localStorage.getItem('transactions')) || [];

    // DOM Elements
    const balanceDisplay = document.getElementById('balanceDisplay');
    const balanceCard = document.getElementById('balanceCard');
    const transactionList = document.getElementById('transactionList');
    const amountInput = document.getElementById('amount');
    const categoryInput = document.getElementById('category');

    // App Initialization
    function init() {
        updateUI();
    }

    function updateUI() {
        // Update Balance Text
        balanceDisplay.innerText = `₹${balance.toFixed(2)}`;
        
        // Change color to Red if balance goes below 0
        if (balance < 0) {
            balanceCard.classList.add('negative');
        } else {
            balanceCard.classList.remove('negative');
        }

        // Render List
        transactionList.innerHTML = '';
        transactions.forEach(t => {
            const li = document.createElement('li');
            li.className = `transaction-item ${t.type}-type`;
            
            li.innerHTML = `
                <div class="item-details">
                    <span style="font-weight: 500;">${t.type === 'income' ? '➕' : '➖'} ${t.category}</span>
                </div>
                <div class="item-amount" style="color: ${t.type === 'income' ? '#27ae60' : '#c0392b'}">
                    ${t.type === 'income' ? '+' : '-'}₹${t.amount.toFixed(2)}
                </div>
            `;
            transactionList.appendChild(li);
        });

        // Save to LocalStorage
        localStorage.setItem('balance', balance);
        localStorage.setItem('transactions', JSON.stringify(transactions));
    }

    function addTransaction(type) {
        const amount = parseFloat(amountInput.value);
        let category = categoryInput.value.trim();

        if (isNaN(amount) || amount <= 0) {
            alert('Please enter a valid amount!');
            return;
        }

        if (category === '') {
            category = type === 'income' ? 'General Income' : 'General Expense';
        }

        if (type === 'income') {
            balance += amount;
        } else {
            balance -= amount;
        }

        // Add to array (at the beginning)
        transactions.unshift({
            type: type,
            amount: amount,
            category: category,
            date: new Date().toLocaleDateString()
        });

        // Reset inputs & Update UI
        amountInput.value = '';
        categoryInput.value = '';
        updateUI();
    }

    // Run on Load
    init();
</script>

</body>
</html>
