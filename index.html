<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PocketPaisa Pro - Smart Money Tracker</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; transition: background-color 0.3s, color 0.3s; }
        body { background-color: #f0f3f7; color: #333; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; }
        body.dark-mode { background-color: #1a252f; color: #f5f6fa; }
        .app-container { background: white; width: 100%; max-width: 480px; padding: 25px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); }
        body.dark-mode .app-container { background: #2c3e50; color: white; }
        .ai-panel { background: #2c3e50; color: white; padding: 15px; border-radius: 10px; margin-bottom: 20px; display: none; text-align: center; }
        .btn-action { background: #3498db; color: white; padding: 10px; border: none; border-radius: 8px; width: 100%; margin-top: 5px; cursor: pointer; }
        .header-area { display: flex; justify-content: center; align-items: center; position: relative; margin-bottom: 20px; }
        .three-dot-btn { position: absolute; right: 0; background: none; border: none; color: #2c3e50; font-size: 24px; cursor: pointer; }
        body.dark-mode .three-dot-btn { color: white; }
        .settings-menu { display: none; background: #f8f9fa; border: 1px solid #ddd; border-radius: 8px; padding: 15px; margin-bottom: 15px; }
        body.dark-mode .settings-menu { background: #34495e; border-color: #455a64; }
        .settings-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .btn-utility { padding: 8px 12px; font-size: 12px; border-radius: 6px; background-color: #7f8c8d; color: white; border: none; cursor: pointer; }
        .dashboard-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .card { padding: 15px; border-radius: 10px; color: white; text-align: center; }
        .balance-card { background: linear-gradient(135deg, #2ecc71, #27ae60); }
        .salary-card { background: linear-gradient(135deg, #3498db, #2980b9); }
        .input-group { margin-bottom: 12px; }
        .input-group input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; }
        .btn-container { display: flex; gap: 10px; margin-top: 15px; }
        button { padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; color: white; }
        .btn-income { background-color: #2ecc71; flex: 1; }
        .btn-expense { background-color: #e74c3c; flex: 1; }
        .transaction-list { list-style: none; max-height: 200px; overflow-y: auto; }
        .transaction-item { display: flex; justify-content: space-between; padding: 10px; background: #f8f9fa; margin-bottom: 8px; border-radius: 6px; border-left: 5px solid #ccc; font-size: 13px;}
        body.dark-mode .transaction-item { background: #34495e; color: white; }
        .income-type { border-left-color: #2ecc71; }
        .expense-type { border-left-color: #e74c3c; }
        .warning-banner { color: white; padding: 12px; border-radius: 8px; text-align: center; font-weight: bold; margin-bottom: 20px; display: none; }
        .warn-95 { background-color: #f39c12; }
        .warn-over { background-color: #e74c3c; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header-area"><h2>💰 PocketPaisa Pro</h2><button class="three-dot-btn" onclick="toggleSettings()">⋮</button></div>

    <div class="settings-menu" id="settingsMenu">
        <div class="settings-row"><label>Currency:</label><select id="currencySelect" onchange="changeCurrency()"><option value="₹">INR (₹)</option><option value="$">USD ($)</option></select></div>
        <div class="settings-row"><label>Language:</label><select id="languageSelect" onchange="changeLanguage()"><option value="hi">Hindi</option><option value="en">English</option></select></div>
        <button class="btn-utility" onclick="toggleDarkMode()">🌓 Dark Mode</button>
        <button class="btn-utility" style="background:#c0392b" onclick="resetAllData()">🗑️ Reset</button>
    </div>

    <div class="warning-banner warn-95" id="warn95Banner">⚠️ बजट 95% तक पहुँच गया!</div>
    <div class="warning-banner warn-over" id="warnOverBanner">🚨 खतरा! बजट खत्म!</div>

    <div id="aiPanel" class="ai-panel">
        <h4 id="aiAdvice">AI Analyzing...</h4>
        <p id="avgDisplay">Daily Avg: 0</p>
    </div>
    <button class="btn-action" onclick="toggleAI()">📊 AI Stats</button>

    <div class="dashboard-grid">
        <div class="card salary-card"><p>Salary</p><h3 id="salaryDisplay">0</h3></div>
        <div class="card balance-card"><p>Balance</p><h3 id="balanceDisplay">0</h3></div>
    </div>

    <div class="input-group">
        <input type="number" id="salaryInput" placeholder="Set Salary">
        <button onclick="setSalary()" style="background:#34495e; width:100%; margin-top:5px;">Update Salary</button>
    </div>

    <div class="input-group">
        <input type="number" id="amount" placeholder="Amount">
        <input type="text" id="category" placeholder="Category">
    </div>

    <div class="btn-container">
        <button class="btn-income" onclick="addTransaction('income')">+ Income</button>
        <button class="btn-expense" onclick="addTransaction('expense')">- Expense</button>
    </div>

    <h3>Passbook</h3>
    <ul class="transaction-list" id="transactionList"></ul>
</div>

<script>
    let salary = parseFloat(localStorage.getItem('web_salary_v2')) || 0;
    let balance = parseFloat(localStorage.getItem('web_balance_v2')) || 0;
    let transactions = JSON.parse(localStorage.getItem('web_transactions_v2')) || [];
    let currentCurrency = localStorage.getItem('web_currency') || '₹';
    let currentLang = localStorage.getItem('web_lang') || 'hi';

    function updateUI() {
        document.getElementById('salaryDisplay').innerText = currentCurrency + salary;
        document.getElementById('balanceDisplay').innerText = currentCurrency + balance;
        
        // Budget Logic
        let totalExpense = transactions.filter(t => t.type === 'expense').reduce((sum, t) => sum + t.amount, 0);
        let warn95 = document.getElementById('warn95Banner');
        let warnOver = document.getElementById('warnOverBanner');
        warn95.style.display = (salary > 0 && totalExpense >= salary * 0.95 && totalExpense < salary) ? 'block' : 'none';
        warnOver.style.display = (salary > 0 && totalExpense >= salary) ? 'block' : 'none';

        let list = document.getElementById('transactionList');
        list.innerHTML = '';
        transactions.forEach(item => {
            list.innerHTML += `<li class="transaction-item ${item.type}-type"><div>${item.category}<br><small>${item.date}</small></div><div>${item.type=='income'?'+':'-'}${currentCurrency}${item.amount}</div></li>`;
        });
    }

    function addTransaction(type) {
        let amt = parseFloat(document.getElementById('amount').value);
        let cat = document.getElementById('category').value || "General";
        if(isNaN(amt)) return;
        if(type === 'income') balance += amt; else balance -= amt;
        
        let date = new Date().toLocaleDateString();
        transactions.unshift({ type, amount: amt, category: cat, date: date });
        
        localStorage.setItem('web_transactions_v2', JSON.stringify(transactions));
        localStorage.setItem('web_balance_v2', balance);
        document.getElementById('amount').value = '';
        document.getElementById('category').value = '';
        updateUI();
    }

    function setSalary() {
        salary = parseFloat(document.getElementById('salaryInput').value);
        balance = salary;
        localStorage.setItem('web_salary_v2', salary);
        localStorage.setItem('web_balance_v2', balance);
        updateUI();
    }

    function toggleSettings() { document.getElementById('settingsMenu').style.display = (document.getElementById('settingsMenu').style.display === 'block') ? 'none' : 'block'; }
    function toggleDarkMode() { document.body.classList.toggle('dark-mode'); }
    function changeCurrency() { currentCurrency = document.getElementById('currencySelect').value; localStorage.setItem('web_currency', currentCurrency); updateUI(); }
    function changeLanguage() { currentLang = document.getElementById('languageSelect').value; localStorage.setItem('web_lang', currentLang); updateUI(); }
    function toggleAI() { let p = document.getElementById('aiPanel'); p.style.display = (p.style.display === 'block') ? 'none' : 'block'; }
    function resetAllData() { localStorage.clear(); location.reload(); }

    // Init
    document.getElementById('currencySelect').value = currentCurrency;
    document.getElementById('languageSelect').value = currentLang;
    updateUI();
</script>
</body>
</html>
